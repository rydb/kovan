\* MUTATION keep_inbox_ref: freeing a chunk keeps its reference to the inbox. Expected: NoLeak broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Releasers = {1, 2}
    Ops = 4
    CAP = 2
    NChunks = 3
    Mutation = "keep_inbox_ref"
INVARIANTS
    NoLeak
    NoUseAfterFree
    BlockOnce
    BlocksOfFreed
    UsedRight
    CountsRight
