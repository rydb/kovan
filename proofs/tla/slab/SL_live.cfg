\* An owner and two releasers, every thread scheduled fairly: every operation and the exit
\* end.
SPECIFICATION FairSpec
CONSTANTS
    Releasers = {1, 2}
    Ops = 3
    CAP = 2
    NChunks = 3
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    BlockOnce
    BlocksOfFreed
    UsedRight
    CountsRight
    NoLeak
PROPERTIES
    Termination
