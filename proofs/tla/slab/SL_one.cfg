\* An owner and one releaser, eight operations: the owner reuses, frees and keeps a spare.
SPECIFICATION Spec
CONSTANTS
    Releasers = {1}
    Ops = 8
    CAP = 2
    NChunks = 3
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    BlockOnce
    BlocksOfFreed
    UsedRight
    CountsRight
    NoLeak
