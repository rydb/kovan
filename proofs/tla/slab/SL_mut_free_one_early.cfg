\* MUTATION free_one_early: the owner frees a chunk with one block still out. Expected: BlocksOfFreed broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Releasers = {1}
    Ops = 8
    CAP = 2
    NChunks = 3
    Mutation = "free_one_early"
INVARIANTS
    BlocksOfFreed
    NoUseAfterFree
    BlockOnce
    UsedRight
    CountsRight
    NoLeak
