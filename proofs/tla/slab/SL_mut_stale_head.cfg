\* Expected: Termination broken.
SPECIFICATION FairSpec
CONSTANTS
    Releasers = {1, 2}
    Ops = 3
    CAP = 2
    NChunks = 3
    Mutation = "stale_head"
INVARIANTS
    NoUseAfterFree
    BlockOnce
    BlocksOfFreed
    UsedRight
    CountsRight
    NoLeak
PROPERTIES
    Termination
