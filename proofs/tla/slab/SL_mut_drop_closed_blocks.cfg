\* MUTATION drop_closed_blocks: the close drops the blocks it collected. Expected: BlockOnce broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Releasers = {1, 2}
    Ops = 4
    CAP = 2
    NChunks = 3
    Mutation = "drop_closed_blocks"
INVARIANTS
    BlockOnce
    NoUseAfterFree
    BlocksOfFreed
    UsedRight
    CountsRight
    NoLeak
