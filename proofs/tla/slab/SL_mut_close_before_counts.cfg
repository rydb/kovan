\* MUTATION close_before_counts: the exiting owner closes the inbox before writing the counts. Expected: CountsRight broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Releasers = {1, 2}
    Ops = 4
    CAP = 2
    NChunks = 3
    Mutation = "close_before_counts"
INVARIANTS
    CountsRight
    NoUseAfterFree
    BlockOnce
    BlocksOfFreed
    UsedRight
    NoLeak
