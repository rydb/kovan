\* MUTATION touch_after_push: a releaser reads the chunk after its push. Expected: NoUseAfterFree broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Releasers = {1, 2}
    Ops = 4
    CAP = 2
    NChunks = 3
    Mutation = "touch_after_push"
INVARIANTS
    NoUseAfterFree
    BlockOnce
    BlocksOfFreed
    UsedRight
    CountsRight
    NoLeak
