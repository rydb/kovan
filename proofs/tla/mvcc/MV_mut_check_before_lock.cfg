\* MUTATION check_before_lock: prewrite checks the write column before it takes the locks, so a
\* writer can commit the key between the check and the lock.
\* Expected: FirstCommitterWins broken.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_si
    Seeded = {1}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "check_before_lock"
INVARIANTS
    FirstCommitterWins
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
