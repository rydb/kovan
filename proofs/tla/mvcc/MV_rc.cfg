\* A writer of keys 1 and 2, a ReadCommitted reader that reads key 1 twice, and a
\* delete of key 1 with a write then delete of key 2; both keys committed before.
\* What it catches: a read at a fresh timestamp that misses a commit before it or sees
\* one after it, a Delete answered as a value.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_rc
    Seeded = {1, 2}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "none"
INVARIANTS
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
