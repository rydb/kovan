\* External-apply mode: two writers the embedder registers at their first write and
\* marks applied after commit, a third it registers that drops its transaction, and a
\* caller of safe_read_ts (one call).
\* What it catches: a horizon at or above the commit_ts of a writer still being
\* applied, a writer left registered.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_ext3
    Seeded = {1}
    ExtApply = TRUE
    Hz = {8}
    HzRounds = 1
    SpinCap = 1
    ScanRetries = 2
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "none"
INVARIANTS
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
    SafeReadTs
