\* INERT epoch_ignored: register bumps the epoch before its insert, and min_ts trusts every
\* pass without its second epoch load.
\* Not the code: a rule put back that no property here tells apart. Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_ext
    Seeded = {1}
    ExtApply = TRUE
    Hz = {8}
    HzRounds = 2
    SpinCap = 1
    ScanRetries = 2
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "epoch_ignored"
INVARIANTS
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
    SafeReadTs
