\* MUTATION lock_get_then_insert, against PrimaryHeld alone: two transactions both take a
\* key's lock, the later insert overwriting the earlier, whose commit_primary then finds the
\* primary's lock another's.
\* Expected: PrimaryHeld broken.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_si
    Seeded = {1}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "lock_get_then_insert"
INVARIANTS
    PrimaryHeld
