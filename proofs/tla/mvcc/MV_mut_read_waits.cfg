\* MUTATION read_waits: a read that meets a lock looks again until the lock is gone and
\* never gives up. Only the readers scheduled fairly.
\* Expected: ReadersEnd broken.
SPECIFICATION ReadersSpec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_readers
    Seeded = {1}
    ExtApply = TRUE
    Hz = {8}
    HzRounds = 1
    SpinCap = 1
    ScanRetries = 2
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "read_waits"
PROPERTIES
    ReadersEnd
