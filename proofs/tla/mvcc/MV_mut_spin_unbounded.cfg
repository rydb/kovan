\* MUTATION spin_unbounded: safe_read_ts spins while a writer is at or below oracle_now, with
\* no cap. Only the readers scheduled fairly.
\* Expected: ReadersEnd broken.
SPECIFICATION ReadersSpec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_readers
    Seeded = {1}
    ExtApply = TRUE
    Hz = {8}
    HzRounds = 1
    SpinCap = 1
    ScanRetries = 2
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "spin_unbounded"
PROPERTIES
    ReadersEnd
