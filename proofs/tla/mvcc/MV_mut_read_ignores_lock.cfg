\* MUTATION read_ignores_lock: a read goes to the write column without looking at the key's lock,
\* so it misses a commit whose timestamp is below its own but whose record is not written.
\* Expected: SnapshotRead broken.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_si
    Seeded = {1}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "read_ignores_lock"
INVARIANTS
    SnapshotRead
    TsIncreasing
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
