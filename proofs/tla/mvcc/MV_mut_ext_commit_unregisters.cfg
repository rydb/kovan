\* MUTATION ext_commit_unregisters: commit unregisters the writer in external-apply mode too, before
\* the embedder applied it.
\* Expected: SafeReadTs broken.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_ext
    Seeded = {1}
    ExtApply = TRUE
    Hz = {8}
    HzRounds = 1
    SpinCap = 1
    ScanRetries = 2
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "ext_commit_unregisters"
INVARIANTS
    SafeReadTs
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
