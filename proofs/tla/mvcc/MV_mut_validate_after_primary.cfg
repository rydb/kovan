\* MUTATION validate_after_primary: the SSI validation runs after the primary committed: a failed one
\* rolls the secondaries back under a committed primary.
\* Expected: AllOrNothing broken.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2, 3}
    Plan <- P_late
    Seeded = {}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "validate_after_primary"
INVARIANTS
    AllOrNothing
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    PrimaryHeld
    NoLeak
