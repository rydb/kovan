\* The write skew: two Serializable transactions each read the key the other writes; a
\* Repeatable Read reader of both that then writes key 1; a read-only Serializable
\* reader; both keys committed before.
\* What it catches: both Serializable transactions committing, a rollback's lock,
\* data or record wrong, a rollback record that lets a prewrite through.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_ser4
    Seeded = {1, 2}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "none"
INVARIANTS
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
