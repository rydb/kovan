\* A writer of keys 1 and 2, a Serializable reader-writer, a ReadCommitted reader, every
\* thread scheduled fairly.
\* What it catches: a transaction that never ends, a lock never released.
SPECIFICATION FairSpec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_live
    Seeded = {1, 2}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "none"
INVARIANTS
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
PROPERTIES
    Termination
    LocksReleased
