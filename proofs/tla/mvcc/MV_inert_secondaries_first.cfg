\* INERT secondaries_first: commit writes the secondaries' records before the primary's; every
\* property but PrimaryDecides, the one that names the order.
\* Not the code: a rule put back that no property here tells apart. Expected: pass.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_si4
    Seeded = {1}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "secondaries_first"
INVARIANTS
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    AllOrNothing
    PrimaryHeld
    NoLeak
