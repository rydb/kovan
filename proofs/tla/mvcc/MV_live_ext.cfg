\* External-apply mode with two registered writers and a caller of safe_read_ts
\* (one call), every thread scheduled fairly.
\* What it catches: a safe_read_ts call or a transaction that never ends.
SPECIFICATION FairSpec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_ext
    Seeded = {1}
    ExtApply = TRUE
    Hz = {8}
    HzRounds = 1
    SpinCap = 1
    ScanRetries = 2
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "none"
INVARIANTS
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
    SafeReadTs
PROPERTIES
    Termination
    LocksReleased
