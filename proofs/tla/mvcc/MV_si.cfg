\* Two writers of keys 1 and 2 with different primaries, and two readers of both (in
\* either order); key 1 committed before.
\* What it catches: two overlapping writers of a key both committing, a read that misses
\* a commit at or before its start_ts or sees one after it, a commit seen half done, a
\* lock or a version left behind.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_si4
    Seeded = {1}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "none"
INVARIANTS
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
