\* MUTATION read_data_column: a read answers the latest data at or below its timestamp without
\* the write column, so it can answer a prewritten value of a transaction not committed
\* before it.
\* Expected: NoDirtyRead broken.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_si
    Seeded = {1}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "read_data_column"
INVARIANTS
    NoDirtyRead
    TsIncreasing
    SnapshotRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
