\* Two read-modify-writes of key 1 (one reads its own write back), a writer of keys
\* 2 and 1 that drops its transaction, a ReadCommitted read-modify-write of key 2.
\* What it catches: the lost update (both read-modify-writes committing), a dropped
\* transaction's write seen or left behind.
SPECIFICATION Spec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_rw
    Seeded = {1}
    ExtApply = FALSE
    Hz = {}
    HzRounds = 0
    SpinCap = 0
    ScanRetries = 1
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "none"
INVARIANTS
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
