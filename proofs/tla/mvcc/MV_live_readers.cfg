\* External-apply mode: a registered writer of keys 2 and 1, a reader of both keys
\* and a caller of safe_read_ts (one call); only the reader and the caller
\* scheduled fairly, so the writer may stop anywhere, holding its locks or its
\* registration.
\* What it catches: a read or a safe_read_ts call that waits for a writer.
SPECIFICATION ReadersSpec
CONSTANTS
    Keys = {1, 2}
    Plan <- P_readers
    Seeded = {1}
    ExtApply = TRUE
    Hz = {8}
    HzRounds = 1
    SpinCap = 1
    ScanRetries = 2
    Gc = {}
    GcRounds = 0
    Watermark = "registry"
    Mutation = "none"
INVARIANTS
    TsIncreasing
    SnapshotRead
    NoDirtyRead
    VersionData
    SerialReads
    FirstCommitterWins
    PrimaryDecides
    AllOrNothing
    PrimaryHeld
    NoLeak
    SafeReadTs
PROPERTIES
    ReadersEnd
