\* MUTATION into_inner_no_forget: into_inner does not forget self, so the atom's Drop runs on the
\* node into_val freed. Expected: DropOnce broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgInner
    InitNone = FALSE
    NA = 4
    MaxEpoch = 3
    Wit = "none"
    Mutation = "into_inner_no_forget"
INVARIANTS
    DropOnce
    NoUseAfterFree
    NoLeak
    Linearizable
    CasExact
    RcuApplies
    LockFree
