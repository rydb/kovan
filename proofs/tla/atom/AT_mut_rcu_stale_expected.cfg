\* MUTATION rcu_stale_expected: rcu loads the word once, before its loop, and retries against
\* that. Expected: LockFree broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgRcu
    InitNone = FALSE
    NA = 5
    MaxEpoch = 3
    Wit = "none"
    Mutation = "rcu_stale_expected"
INVARIANTS
    LockFree
    NoUseAfterFree
    DropOnce
    NoLeak
    Linearizable
    CasExact
    RcuApplies
