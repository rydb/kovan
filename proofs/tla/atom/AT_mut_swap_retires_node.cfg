\* MUTATION swap_retires_node: swap retires the old node at once, as store does, while the
\* Removed still reads the value in it. Expected: NoUseAfterFree broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgStore
    InitNone = FALSE
    NA = 5
    MaxEpoch = 3
    Wit = "none"
    Mutation = "swap_retires_node"
INVARIANTS
    NoUseAfterFree
    DropOnce
    NoLeak
    Linearizable
    CasExact
    RcuApplies
    LockFree
    OneObject
