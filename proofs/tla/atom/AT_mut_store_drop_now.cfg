\* MUTATION store_drop_now: store drops the old value and frees its node at once instead of
\* retiring it. Expected: NoUseAfterFree broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgStore
    InitNone = FALSE
    NA = 5
    MaxEpoch = 3
    Wit = "none"
    Mutation = "store_drop_now"
INVARIANTS
    NoUseAfterFree
    DropOnce
    NoLeak
    Linearizable
    CasExact
    RcuApplies
    LockFree
