\* MUTATION cas_check_then_store: compare_and_swap decides from its load, then swaps the word in
\* unconditionally. Expected: CasExact broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgCas
    InitNone = FALSE
    NA = 4
    MaxEpoch = 3
    Wit = "none"
    Mutation = "cas_check_then_store"
INVARIANTS
