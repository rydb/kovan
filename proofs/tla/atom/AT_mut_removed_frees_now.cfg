\* MUTATION removed_frees_now: the Removed's drop frees the node at once, under a reader that
\* loaded it. Expected: NoUseAfterFree broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgStore
    InitNone = FALSE
    NA = 5
    MaxEpoch = 3
    Wit = "none"
    Mutation = "removed_frees_now"
INVARIANTS
    NoUseAfterFree
    DropOnce
    NoLeak
    Linearizable
    CasExact
    RcuApplies
    LockFree
    OneObject
