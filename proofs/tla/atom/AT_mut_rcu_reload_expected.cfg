\* MUTATION rcu_reload_expected: rcu loads the word again after its closure ran and compares
\* against that. Expected: RcuApplies broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgCas
    InitNone = FALSE
    NA = 4
    MaxEpoch = 3
    Wit = "none"
    Mutation = "rcu_reload_expected"
INVARIANTS
    RcuApplies
    NoUseAfterFree
    DropOnce
    NoLeak
    Linearizable
    CasExact
    LockFree
