\* MUTATION cas_load_unprotected: compare_and_swap loads the word without the era check, so the
\* guard it returns does not cover the node it published once a retire in the same section moved
\* the epoch. Expected: NoUseAfterFree broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Prog <- ProgCasOk
    InitNone = FALSE
    NA = 5
    MaxEpoch = 3
    Wit = "none"
    Mutation = "cas_load_unprotected"
INVARIANTS
    NoUseAfterFree
    DropOnce
    NoLeak
    Linearizable
    CasExact
    RcuApplies
    LockFree
