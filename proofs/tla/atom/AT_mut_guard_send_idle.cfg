\* MUTATION guard_send: AtomGuard is Send (before 7d0c6fe): a guard dropped on a thread with no
\* guard leaves its own thread pinned for good, every thread scheduled fairly. Expected: Reclaimed
\* broken. The safety properties hold beside it.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgSendIdle
    InitNone = FALSE
    NA = 3
    MaxEpoch = 3
    Wit = "none"
    Mutation = "guard_send"
INVARIANTS
    NoUseAfterFree
    DropOnce
    NoLeak
    Linearizable
    CasExact
    RcuApplies
    LockFree
PROPERTIES
    Reclaimed
