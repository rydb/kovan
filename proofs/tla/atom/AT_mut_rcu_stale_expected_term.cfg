\* MUTATION rcu_stale_expected, checked against Termination: an rcu that lost one race retries
\* against a stale pointer forever, every thread scheduled fairly. Expected: Termination broken.
\* LockFree, which breaks first, is left out.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgLive
    InitNone = FALSE
    NA = 5
    MaxEpoch = 3
    Wit = "none"
    Mutation = "rcu_stale_expected"
INVARIANTS
    NoUseAfterFree
    DropOnce
    NoLeak
    Linearizable
    CasExact
    RcuApplies
PROPERTIES
    Termination
