\* MUTATION load_unprotected, checked against CasExact: a guard that does not protect its node
\* lets the node's address be freed and reused, and compare_and_swap's pointer compare then
\* succeeds against another node. Expected: CasExact broken. NoUseAfterFree, which breaks first,
\* is left out.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Prog <- ProgAba
    InitNone = FALSE
    NA = 6
    MaxEpoch = 3
    Wit = "none"
    Mutation = "load_unprotected"
INVARIANTS
    CasExact
    DropOnce
    NoLeak
    Linearizable
    RcuApplies
    LockFree
