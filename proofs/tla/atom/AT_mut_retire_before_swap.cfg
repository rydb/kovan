\* MUTATION retire_before_swap: store retires the node the word names before the swap that
\* unlinks it. Expected: NoUseAfterFree broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgStore
    InitNone = FALSE
    NA = 5
    MaxEpoch = 3
    Wit = "none"
    Mutation = "retire_before_swap"
INVARIANTS
    NoUseAfterFree
    DropOnce
    NoLeak
    Linearizable
    CasExact
    RcuApplies
    LockFree
