\* Two rcus, a swap and the drop of its Removed, then the atom's drop, every thread and the
\* reclamation scheduled fairly: every operation ends and every node retired is freed.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2, 3}
    Prog <- ProgLive
    InitNone = FALSE
    NA = 5
    MaxEpoch = 3
    Wit = "none"
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    NoLeak
    Linearizable
    OneObject
    CasExact
    RcuApplies
    LockFree
PROPERTIES
    Termination
    Reclaimed
