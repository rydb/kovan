\* MUTATION flush_skips_batch: flush on a thread with no tid ignores its own batch while nothing is parked, so a thread that flushes and lives on never frees what it retired without pinning. Expected: RetiredFreed broken.
\* What it catches: the flush half of the fix taken out alone (the exit half stays). Same
\* scenario as RC_live_unpinned_flush. In the counterexample TLC finds, the flush returns at once,
\* the thread pins and unpins forever, and the value stays in its batch, never freed:
\* RetiredFreed broken. NoLoss cannot show this half: it looks only at the end, once every thread
\* has exited, and the exit half alone submits the batch at the exit.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1}
    MaxTid = 1
    NCells = 1
    MaxNodes = 2
    Prog <- P_unpinned_flush_live
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "flush_skips_batch"
    CountSteps = FALSE
    defaultInitValue = 0
PROPERTIES
    RetiredFreed
