\* WITNESS: a flush on a thread with no tid claims one for its own batch. Expected: NoFlushClaimW broken.
\* What it catches: nothing in the code. It asserts that no flush ever claims a tid, on the
\* scenario of RC_wf_unpinned_flush, where nothing is ever parked before that flush, so a claim
\* there is made for the thread's own batch. TLC breaking it shows that the scenario reaches that
\* branch, so the pass of RC_wf_unpinned_flush covers it.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 2
    Prog <- P_wf_unpinned_flush
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoFlushClaimW
