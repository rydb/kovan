\* MUTATION batch_needs_tid: flush and exit on a thread with no tid leave its own batch alone, so what a thread retired without pinning is never submitted. Expected: NoLoss broken.
\* What it catches: the defect this mutation puts back, the early returns as the orphan fix left
\* them: on a thread with no tid, flush() returned when nothing was parked even with values in
\* its batch, and the exit did nothing. Same scenario as RC_unpinned_retire. In the
\* counterexample TLC finds, a value a thread retired without pinning is neither freed nor
\* parked when every thread has exited, which breaks NoLoss: the batch stayed in a handle that
\* no thread uses any more.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2, 3}
    MaxTid = 3
    NCells = 1
    MaxNodes = 3
    Prog <- P_unpinned
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "batch_needs_tid"
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoLoss
