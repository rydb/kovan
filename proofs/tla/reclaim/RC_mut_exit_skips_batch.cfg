\* MUTATION exit_skips_batch: the exit of a thread with no tid does nothing, so what a thread retired without pinning and never flushed is never submitted. Expected: NoLoss broken.
\* What it catches: the exit half of the fix taken out alone (the flush half stays). Same
\* scenario as RC_wf_unpinned_exit: thread 1 never flushes, so only its exit can submit its
\* value. In the counterexample TLC finds, thread 1's exit returns at once, both threads end,
\* and the value is still in thread 1's batch, neither freed nor parked: NoLoss broken.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 2
    Prog <- P_wf_unpinned_exit
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "exit_skips_batch"
    Recycle = FALSE
    CountSteps = FALSE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoLoss
