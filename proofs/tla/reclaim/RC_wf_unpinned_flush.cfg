\* Step counts: a thread that never pinned retires one value, flushes and exits while another pins and unpins: its flush claims a tid and submits.
\* What it catches: a flush that claims a tid for its own batch breaking a property or its step
\* bound. Thread 1 retires one value without pinning (a batch of two does not submit it),
\* flushes, then exits with the tid its flush took; with nothing parked anywhere, the flush
\* claims because its own batch holds the value. Thread 2 pins, unpins and exits. TLC tries
\* every interleaving and checks the invariants below on each, with the step counts on: NoLoss
\* and WaitFree (the flush, its tid claim included, within its step bound) among them.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 2
    Prog <- P_wf_unpinned_flush
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
    WaitFree
