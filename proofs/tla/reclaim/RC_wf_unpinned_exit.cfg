\* Step counts: a thread that never pinned retires one value and exits while another pins and unpins: its exit claims a tid and submits.
\* What it catches: an exit that claims a tid breaking a property or its step bound. Thread 1
\* retires one value without pinning (a batch of two does not submit it) and exits, so its exit
\* finds no tid and a value in its batch: it claims a tid, then runs the exit every thread runs.
\* Thread 2 pins, unpins and exits; until it exits, a one-value batch cannot be placed, so thread
\* 1's exit may also have to park it. TLC tries every interleaving and checks the invariants
\* below on each, with the step counts on: NoLoss (once both have exited, the value is freed or
\* parked) and WaitFree (the exit, its tid claim included, within its step bound) among them.
SPECIFICATION SpecW
CONSTANTS
    Threads = {1, 2}
    MaxTid = 2
    NCells = 1
    MaxNodes = 2
    Prog <- P_wf_unpinned_exit
    Dtor <- Plain
    RetireFreq = 2
    EpochFreq = 2
    MaxCache = 1
    LoadAttempts = 2
    PinAttempts = 2
    ExitRounds = 2
    MaxEpoch = 10
    Mutation = "none"
    CountSteps = TRUE
    defaultInitValue = 0
CONSTRAINT EpochBound
INVARIANTS
    NoUseAfterFree
    ListsHoldNoFreed
    NoDoubleFree
    NoNullDeref
    PinDrains
    WellFormed
    EscalationBounded
    CacheBelowPublished
    DetachNotStarved
    BirthFresh
    FlushReleases
    LoopBounds
    NoLoss
    WaitFree
