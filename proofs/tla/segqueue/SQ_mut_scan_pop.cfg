    defaultInitValue = 0
    Producers = {1, 2}
    Consumers = {3}
    K = 2
    Pops = 4
    Try = FALSE
    SEG = 2
    MaxSegs = 5
    Mutation = "scan_pop"
INVARIANTS
    PopOrder
    NoUseAfterFree
    NoUnlinkedClaim
    NoBound
    EmptySound
    BusyMeansClaimed
    UniqueTake
    RealTimeOrder
    NoLoss
    Words
