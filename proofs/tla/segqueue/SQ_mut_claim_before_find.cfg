\* MUTATION claim_before_find (the code before the fix): a pop claims with a fetch-add, then walks
\* to the cell; the head can move past the claim's segment first, and the value in the cell is
\* then never taken. Expected: NoLoss broken.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Producers = {1}
    Consumers = {3, 4}
    K = 3
    Pops = 2
    Try = FALSE
    SEG = 2
    MaxSegs = 5
    Mutation = "claim_before_find"
INVARIANTS
    NoLoss
    NoUseAfterFree
    NoUnlinkedClaim
    NoBound
    EmptySound
    BusyMeansClaimed
    UniqueTake
    RealTimeOrder
    PopOrder
    Words
