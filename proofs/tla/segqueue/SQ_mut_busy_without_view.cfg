\* MUTATION busy_without_view: try_pop answers Busy without telling from the words that a push
\* claimed the cell. Expected: BusyMeansClaimed broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Producers = {1, 2}
    Consumers = {3}
    K = 2
    Pops = 4
    Try = TRUE
    SEG = 2
    MaxSegs = 5
    Mutation = "busy_without_view"
INVARIANTS
    BusyMeansClaimed
    NoUseAfterFree
    NoUnlinkedClaim
    NoBound
    EmptySound
    UniqueTake
    RealTimeOrder
    PopOrder
    NoLoss
    Words
