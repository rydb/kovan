\* MUTATION link_then_retry: a push that linked the successor with its value goes on pushing the
\* value. Expected: UniqueTake broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Producers = {1, 2}
    Consumers = {3}
    K = 2
    Pops = 4
    Try = FALSE
    SEG = 2
    MaxSegs = 5
    Mutation = "link_then_retry"
INVARIANTS
    UniqueTake
    NoUseAfterFree
    NoUnlinkedClaim
    NoBound
    EmptySound
    BusyMeansClaimed
    RealTimeOrder
    PopOrder
    NoLoss
    Words
