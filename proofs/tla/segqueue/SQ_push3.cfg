\* Three producers pushing two values each and no consumer; segments of two cells.
\* What it catches: a value written ahead of one whose push returned before its own began, with
\* three pushes racing to claim, link and advance the tail.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Producers = {1, 2, 4}
    Consumers = {3}
    K = 2
    Pops = 0
    Try = FALSE
    SEG = 2
    MaxSegs = 6
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    NoUnlinkedClaim
    NoBound
    EmptySound
    BusyMeansClaimed
    UniqueTake
    RealTimeOrder
    PopOrder
    NoLoss
    Words
