\* Two producers pushing one value each and one consumer popping twice, every thread scheduled
\* fairly.
\* What it catches: a push and a pop that keep retrying forever, each taking the other's cell out
\* of play or losing its cell to it.
SPECIFICATION FairSpec
CONSTANTS
    defaultInitValue = 0
    Producers = {1, 2}
    Consumers = {3}
    K = 1
    Pops = 2
    Try = FALSE
    SEG = 2
    MaxSegs = 5
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    NoUnlinkedClaim
    NoBound
    EmptySound
    BusyMeansClaimed
    UniqueTake
    RealTimeOrder
    PopOrder
    NoLoss
    Words
PROPERTIES
    Termination
