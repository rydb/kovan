\* Two producers pushing two values each, one consumer calling try_pop four times.
\* What it catches: a Busy answer for a cell no push claimed, and what SQ_mpsc catches, for the
\* claim by compare-and-swap.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Producers = {1, 2}
    Consumers = {3}
    K = 2
    Pops = 4
    Try = TRUE
    SEG = 2
    MaxSegs = 5
    Mutation = "none"
INVARIANTS
    NoUseAfterFree
    NoUnlinkedClaim
    NoBound
    EmptySound
    BusyMeansClaimed
    UniqueTake
    RealTimeOrder
    PopOrder
    NoLoss
    Words
