\* MUTATION clear_keeps_bound, checked against ShrinkReset alone: a clear leaves the threshold a failed shrink wrote. Expected: ShrinkReset broken.
\* What it catches: a threshold that no longer matches the history (`recorded`): after the clear the
\* history says "no threshold" while the map still holds one. This run shows ShrinkReset can fail and
\* that the checked runs would see it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1}
    RZ = 9
    Keys = {0, 1, 2, 5, 8, 16}
    Prog <- P_shrink_clear
    InitSlots <- S_sparse
    InitCap = 16
    RzProg <- Clear
    NH = 2
    MaxEntries = 10
    MaxTables = 2
    MaxCap = 16
    MinCap = 8
    MaxStamp = 3
    Mutation = "clear_keeps_bound"
INVARIANT
    ShrinkReset
