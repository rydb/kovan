\* MUTATION insert_keeps_guard: an insert publishes its bits but never releases the home guard. Expected: Termination broken.
\* What it catches: a write that waits forever. Worker 2 inserts key 2, whose home is key 0's, and
\* keeps that home's guard; worker 1's remove of key 0 then waits for the guard forever, although
\* every thread is scheduled fairly. In the code every guard taken is released on every path.
SPECIFICATION FairSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {0, 1, 2, 3}
    Prog <- P_same_home
    InitSlots <- S_one
    InitCap = 2
    RzProg <- NoRz
    NH = 2
    MaxEntries = 4
    MaxTables = 1
    MaxCap = 2
    MinCap = 2
    MaxStamp = 3
    Mutation = "insert_keeps_guard"
PROPERTY
    Termination
