\* Two removers: both can ask for a shrink before either fails, so both shrinks can fail at the same count; each worker's failed copies stay within its bound.
SPECIFICATION Spec
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {0, 1, 2, 5, 8, 16}
    Prog <- P_shrink_two
    InitSlots <- S_sparse
    InitCap = 16
    RzProg <- NoRz
    NH = 2
    MaxEntries = 10
    MaxTables = 2
    MaxCap = 16
    MinCap = 8
    MaxStamp = 3
    Mutation = "none"
INVARIANTS
    NoError
    Exactness
    Linearizable
    NoUseAfterFree
    CondExact
    WalkExact
    AbsIsContent
    NoDuplicate
    RetiredUnreachable
    OldHeld
    CountExact
    NoLeak
    NoShrinkRetry
    ShrinkReset
    ShrinkUnblocked
    ShrinkWorkBound
