\* MUTATION resize_retry (0.1.20), checked against OldHeld alone: a resize copies without the writer guards, and a landed insert re-validates and retries in the new table. Expected: OldHeld broken.
\* What it catches: a replaced table that a writer could still write. Under this rule the resize
\* copies without taking the writer guards, so when it publishes the new table, the one it replaced
\* becomes old with its home guards down. This run shows OldHeld can fail and that the checked runs
\* would see it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1}
    RZ = 9
    Keys = {0, 1, 2, 3}
    Prog <- P_claim
    InitSlots <- S_disp
    InitCap = 2
    RzProg <- Grow
    NH = 2
    MaxEntries = 7
    MaxTables = 2
    MaxCap = 4
    MinCap = 4
    MaxStamp = 3
    Mutation = "resize_retry"
INVARIANT
    OldHeld
