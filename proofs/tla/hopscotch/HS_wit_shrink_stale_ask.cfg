\* WITNESS: a worker's shrink runs on an ask made before another worker's shrink failed, and fails at or above the threshold that failure recorded. Expected: NoStaleShrink broken.
SPECIFICATION Spec
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {0, 1, 2, 5, 8, 16}
    Prog <- P_shrink_two
    InitSlots <- S_sparse
    InitCap = 16
    RzProg <- NoRz
    NH = 2
    MaxEntries = 10
    MaxTables = 2
    MaxCap = 16
    MinCap = 8
    MaxStamp = 3
    Mutation = "none"
INVARIANTS
    NoStaleShrink
