\* MUTATION unguarded_remove (0.1.20) against a claim's scan under its home guard, checked against NoLeak alone. Expected: NoLeak broken.
\* What it catches: an entry that is still live but sits in no table in use, or a slot whose entry a
\* lookup cannot reach, once every thread has finished. This run shows NoLeak can fail and that the
\* checked runs would see it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {0, 1, 2, 3}
    Prog <- P_held_scan
    InitSlots <- S_one
    InitCap = 2
    RzProg <- NoRz
    NH = 2
    MaxEntries = 4
    MaxTables = 1
    MaxCap = 2
    MinCap = 2
    MaxStamp = 3
    Mutation = "unguarded_remove"
INVARIANT
    NoLeak
