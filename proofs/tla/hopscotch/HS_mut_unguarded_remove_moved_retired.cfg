\* MUTATION unguarded_remove (0.1.20), with a move, checked against RetiredUnreachable alone. Expected: RetiredUnreachable broken.
\* What it catches: a retired entry still in a slot of a table in use, so a reader could reach memory
\* that is waiting to be freed. A move links key 1's entry at its new slot, and the unguarded remove
\* of key 1 then retires that entry while it is still there. This run shows RetiredUnreachable can
\* fail and that the checked runs would see it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {0, 1, 2, 3}
    Prog <- P_disp_rem
    InitSlots <- S_disp
    InitCap = 2
    RzProg <- NoRz
    NH = 2
    MaxEntries = 4
    MaxTables = 1
    MaxCap = 2
    MinCap = 2
    MaxStamp = 3
    Mutation = "unguarded_remove"
INVARIANT
    RetiredUnreachable
