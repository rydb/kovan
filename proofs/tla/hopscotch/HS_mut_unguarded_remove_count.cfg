\* MUTATION unguarded_remove, checked against CountExact alone: a remove takes no home guard, empties the slot, then clears the bit. Expected: CountExact broken.
\* What it catches: a count that stops matching the entries. The insert that lands in the slot the
\* unguarded remove freed loses its bit, so its entry is counted but no lookup finds it, and once
\* every thread is between operations `len()` disagrees with what the table holds. This run shows
\* CountExact can fail and that the checked runs would see it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {0, 1, 2, 3}
    Prog <- P_same_home
    InitSlots <- S_one
    InitCap = 2
    RzProg <- NoRz
    NH = 2
    MaxEntries = 4
    MaxTables = 1
    MaxCap = 2
    MinCap = 2
    MaxStamp = 3
    Mutation = "unguarded_remove"
INVARIANT
    CountExact
