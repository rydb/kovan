\* MUTATION insert_skips_lookup: a write does not look for the key's entry among the slots it loaded and links a new one. Expected: NoDuplicate broken.
\* What it catches: a key with two entries a lookup can find. Key 0 is in the table from the start and
\* worker 2 inserts it again; skipping the look for its entry, the insert links a second entry of
\* key 0 in the same neighborhood.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {0, 1, 2, 3}
    Prog <- P_rem_ins
    InitSlots <- S_one
    InitCap = 2
    RzProg <- NoRz
    NH = 2
    MaxEntries = 5
    MaxTables = 1
    MaxCap = 2
    MinCap = 2
    MaxStamp = 3
    Mutation = "insert_skips_lookup"
INVARIANT
    NoDuplicate
