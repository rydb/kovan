\* MUTATION get_waits_for_guard: a lookup waits for its home's writer guard, as a lock would. Expected: ReaderEnds broken.
\* What it catches: a reader held up by a writer. Only the reader is scheduled fairly, so the writer
\* may stop while it holds the guard of the reader's home; a lookup that waits for that guard then
\* never ends. In the code a lookup takes no guard, and HS_live_reader proves it ends.
SPECIFICATION ReaderSpec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {0, 1, 2, 3}
    Prog <- P_disp_get
    InitSlots <- S_disp
    InitCap = 2
    RzProg <- NoRz
    NH = 2
    MaxEntries = 4
    MaxTables = 1
    MaxCap = 2
    MinCap = 2
    MaxStamp = 3
    Mutation = "get_waits_for_guard"
PROPERTY
    ReaderEnds
