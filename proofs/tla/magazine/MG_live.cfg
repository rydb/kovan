\* Two threads exiting with three full magazines between them, every thread scheduled fairly: every
\* operation and every exit ends.
SPECIFICATION FairSpec
CONSTANTS
    defaultInitValue = 0
    Threads = {1, 2}
    Ops = 0
    Prog <- ProgExits
    ROUNDS = 1
    SLOTS = 2
    NBlocks = 3
    BATCH = 1
    NMags = 10
    Mutation = "none"
INVARIANTS
    MagOnce
    BlockOnce
    Handover
    FullHoldsBlocks
    Bounded
    PairShape
    ExitReturns
PROPERTIES
    Termination
