\* MUTATION empty_to_full: an exit hands an empty magazine to the full ring. Expected: FullHoldsBlocks broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Threads = {1, 2}
    Ops = 0
    Prog <- ProgEmptyExit
    ROUNDS = 1
    SLOTS = 2
    NBlocks = 4
    BATCH = 1
    NMags = 10
    Mutation = "empty_to_full"
INVARIANTS
    FullHoldsBlocks
    MagOnce
    BlockOnce
    Handover
    Bounded
    PairShape
    ExitReturns
