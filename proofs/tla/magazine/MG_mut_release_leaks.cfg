\* MUTATION release_leaks: a magazine the full ring has no room for has its blocks dropped. Expected:
\* BlockOnce broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Threads = {1}
    Ops = 0
    Prog <- ProgThreeFrees
    ROUNDS = 1
    SLOTS = 2
    NBlocks = 3
    BATCH = 1
    NMags = 7
    Mutation = "release_leaks"
INVARIANTS
    BlockOnce
    MagOnce
    Handover
    FullHoldsBlocks
    Bounded
    PairShape
    ExitReturns
