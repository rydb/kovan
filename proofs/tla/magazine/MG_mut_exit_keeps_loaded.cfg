\* MUTATION exit_keeps_loaded: an exit keeps its loaded magazine. Expected: ExitReturns broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Threads = {1}
    Ops = 0
    Prog <- ProgTwoFrees
    ROUNDS = 1
    SLOTS = 2
    NBlocks = 2
    BATCH = 1
    NMags = 7
    Mutation = "exit_keeps_loaded"
INVARIANTS
    ExitReturns
    MagOnce
    BlockOnce
    Handover
    FullHoldsBlocks
    Bounded
    PairShape
