\* MUTATION push_turn_first: a push publishes the turn before it stores the magazine. Expected: Handover broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Threads = {1, 2}
    Ops = 0
    Prog <- ProgFill2
    ROUNDS = 1
    SLOTS = 2
    NBlocks = 4
    BATCH = 1
    NMags = 10
    Mutation = "push_turn_first"
INVARIANTS
    Handover
    MagOnce
    BlockOnce
    FullHoldsBlocks
    Bounded
    PairShape
    ExitReturns
