\* MUTATION exit_forgets_previous: an exit drops its previous magazine. Expected: MagOnce broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Threads = {1}
    Ops = 0
    Prog <- ProgTwoFrees
    ROUNDS = 1
    SLOTS = 2
    NBlocks = 2
    BATCH = 1
    NMags = 7
    Mutation = "exit_forgets_previous"
INVARIANTS
    MagOnce
    BlockOnce
    Handover
    FullHoldsBlocks
    Bounded
    PairShape
    ExitReturns
