\* A producer allocates two nodes and hands them to a consumer that allocates two and frees
\* all four: blocks freed on another thread than the one that took them, and the depot filled.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Threads = {1, 2}
    Ops = 0
    Prog <- ProgTrade
    ROUNDS = 1
    SLOTS = 2
    NBlocks = 4
    BATCH = 1
    NMags = 6
    Mutation = "none"
INVARIANTS
    MagOnce
    BlockOnce
    Handover
    FullHoldsBlocks
    Bounded
    PairShape
    ExitReturns
