\* Three threads: one fills the depot at its exit while two allocate from it, so two pops race
\* for one magazine.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Threads = {1, 2, 3}
    Ops = 0
    Prog <- ProgRace
    ROUNDS = 1
    SLOTS = 2
    NBlocks = 4
    BATCH = 1
    NMags = 5
    Mutation = "none"
INVARIANTS
    MagOnce
    BlockOnce
    Handover
    FullHoldsBlocks
    Bounded
    PairShape
    ExitReturns
