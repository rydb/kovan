\* Three threads: one allocates, frees and so fills the depot with one full magazine at its exit,
\* while two allocate from it, so their two pops race for that one magazine.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Threads = {1, 2, 3}
    Ops = 0
    Prog <- ProgRace
    ROUNDS = 1
    SLOTS = 2
    NBlocks = 4
    BATCH = 1
    NMags = 5
    Mutation = "none"
INVARIANTS
    MagOnce
    BlockOnce
    Handover
    FullHoldsBlocks
    Bounded
    PairShape
    ExitReturns
