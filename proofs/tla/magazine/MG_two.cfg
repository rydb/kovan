\* Two threads, magazines of one block, rings of two slots: one runs two operations of any
\* kind, the other allocates then frees; every other free and allocation goes to the depot.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Threads = {1, 2}
    Ops = 2
    Prog <- ProgOpen
    ROUNDS = 1
    SLOTS = 2
    NBlocks = 4
    BATCH = 1
    NMags = 10
    Mutation = "none"
INVARIANTS
    MagOnce
    BlockOnce
    Handover
    FullHoldsBlocks
    Bounded
    PairShape
    ExitReturns
