\* Two threads with magazines of two blocks and refills of two blocks: partial magazines,
\* swaps of loaded and previous both ways, a refill that leaves a block in loaded.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = 0
    Threads = {1, 2}
    Ops = 0
    Prog <- ProgRounds
    ROUNDS = 2
    SLOTS = 2
    NBlocks = 8
    BATCH = 2
    NMags = 6
    Mutation = "none"
INVARIANTS
    MagOnce
    BlockOnce
    Handover
    FullHoldsBlocks
    Bounded
    PairShape
    ExitReturns
