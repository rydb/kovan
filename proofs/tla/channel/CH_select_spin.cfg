\* one only. Expected: pass.
SPECIFICATION Spec
CONSTANTS
    defaultInitValue = defaultInitValue
    Threads = {1, 2, 3}
    NC = 2
    Prog <- P_d_k_sel
    Cap = 0
    Stepped = FALSE
    Spurious = FALSE
    Cancel = FALSE
    MaxSig = 12
    Watch = "none"
    Mutation = "none"
INVARIANTS
    NoBound
    NoUseAfterFree
    Fifo
    EmptySound
    NoInconsistentRetry
    ListShape
    NoDuplicate
    NoLoss
    Capacity
    RecvNoneSound
    NoLostWakeup
    WakerExclusive
    WakeNotLost
    SelectOnce
CHECK_DEADLOCK FALSE
