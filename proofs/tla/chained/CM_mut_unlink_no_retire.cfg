\* MUTATION unlink_no_retire: the remove whose CAS unlinks the node never retires it. Expected: NoLeak broken.
\* What it catches: memory that is never freed. Worker 2 removes key 1; its CAS unlinks the node and
\* forgets to retire it, so when every thread is done the node is still live and no table reaches it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {1, 2}
    Prog <- P_ins_rem
    InitChain <- I_ins_rem
    InitCap = 1
    RzProg <- Grow
    MaxNodes = 7
    MaxTables = 2
    MaxCap = 2
    Mutation = "unlink_no_retire"
INVARIANT
    NoLeak
