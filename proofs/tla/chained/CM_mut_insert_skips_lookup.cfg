\* MUTATION insert_skips_lookup: an insert's walk passes over the node of its own key and appends a new node at the tail. Expected: NoDuplicate broken.
\* What it catches: a key with two nodes a lookup can find. Both workers insert key 1; skipping the
\* node of its key, the second insert appends a second node of key 1 to the same chain.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1, 2}
    RZ = 9
    Keys = {1, 2}
    Prog <- P_ins_ins
    InitChain <- I_ins_ins
    InitCap = 1
    RzProg <- Grow
    MaxNodes = 6
    MaxTables = 2
    MaxCap = 2
    Mutation = "insert_skips_lookup"
INVARIANT
    NoDuplicate
