\* MUTATION revalidate (0.1.20), checked against OldFrozen alone. Expected: OldFrozen broken.
\* What it catches: a replaced table whose links a writer could still change. 0.1.20's resize copied
\* the chains without freezing their links (its writers re-validated instead), so once it publishes
\* the new table, the one it replaced is old with links that are not frozen. This run shows OldFrozen
\* can fail and that the checked runs would see it.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
    Workers = {1}
    RZ = 9
    Keys = {1, 2}
    Prog <- P_claim
    InitChain <- I_claim
    InitCap = 1
    RzProg <- Grow
    MaxNodes = 5
    MaxTables = 2
    MaxCap = 2
    Mutation = "revalidate"
INVARIANT
    OldFrozen
