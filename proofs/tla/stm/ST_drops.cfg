\* The drops of tests/drops.rs and more: a store replaced by a second one and both rolled back by
\* a retry; a variable read, its handle dropped, then validated by the commit; a variable whose
\* last reference is the commit's own; while another thread reads, then increments, the first.
\* What it catches: a value dropped twice or never, a variable freed under a read entry, a node
\* freed under a reader.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2, 3}
    Prog <- ProgDrops
    Mutation = "none"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
