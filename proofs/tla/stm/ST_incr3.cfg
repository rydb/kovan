\* Three increments of one variable.
\* What it catches: a lost update between three committers racing for one lock, a node freed
\* under a reader.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Vars = {1}
    Prog <- ProgIncr3
    Mutation = "none"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
