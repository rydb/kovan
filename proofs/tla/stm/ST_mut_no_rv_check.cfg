\* MUTATION no_rv_check: a load accepts a version newer than the read version, checking only the
\* lock bit. Expected: Opacity broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgTransfer
    Mutation = "no_rv_check"
    Witness = "none"
INVARIANTS
    Opacity
    NoUseAfterFree
    DropOnce
    Serializable
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
