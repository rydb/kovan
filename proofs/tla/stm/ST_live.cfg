\* ST_rounds, every thread and the reclamation scheduled fairly.
\* What it catches: a transaction that never ends where no two transactions each read what the
\* other writes, a lock never released.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgRounds
    Mutation = "none"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
PROPERTIES
    Termination
