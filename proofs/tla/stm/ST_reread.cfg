\* A read-only transaction loads a variable twice while another commits it. The second load
\* is validated like the first, so the attempt that meets the commit retries.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1}
    Prog <- ProgReread
    Mutation = "none"
    Witness = "none"
INVARIANTS
    Serializable
    NoUseAfterFree
    DropOnce
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
