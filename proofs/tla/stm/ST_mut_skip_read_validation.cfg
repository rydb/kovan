\* MUTATION skip_read_validation: an update transaction's commit skips the read-set validation,
\* as a read-only one does. Expected: Serializable broken (a write skew).
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgCross
    Mutation = "skip_read_validation"
    Witness = "none"
INVARIANTS
    Serializable
    NoUseAfterFree
    DropOnce
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
