    Vars = {1, 2, 3}
    Prog <- ProgDrops
    Mutation = "no_keep_alive"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
