\* MUTATION keep_locks, scheduled fairly: the lock kept is never released, and the transaction
\* that kept it retries forever on it (the unit test
\* commit_aborting_on_a_held_lock_releases_the_locks_it_took). Expected: Termination broken.
\* LockOwned, which it also breaks, is left out.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgTransfer
    Mutation = "keep_locks"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    NoLeak
PROPERTIES
    Termination
