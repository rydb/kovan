\* WITNESS: a repeat read finds its variable locked, or newer than the read version, and
\* retries. Expected: NoRereadRetryW broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1}
    Prog <- ProgReread
    Mutation = "none"
    Witness = "reread_retry"
INVARIANTS
    NoRereadRetryW
