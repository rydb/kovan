\* MUTATION keep_locks (the code before 0f88841): a commit that meets a lock held by another
\* committer aborts without releasing the locks it took. Expected: LockOwned broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgTransfer
    Mutation = "keep_locks"
    Witness = "none"
INVARIANTS
    LockOwned
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    NoLeak
