\* WITNESS: with every thread scheduled fairly, two transactions that each read what the other
\* writes can abort each other forever: each locks its write, takes the clock, finds the
\* other's lock on the variable it validates, and aborts. Expected: Termination broken.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgCross
    Mutation = "none"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    LockOwned
PROPERTIES
    Termination
