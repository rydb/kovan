\* MUTATION version_before_swap: the commit stores the version (releasing the lock) before
\* swapping the new node in. Expected: AllOrNone broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgTransfer
    Mutation = "version_before_swap"
    Witness = "none"
INVARIANTS
    AllOrNone
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    HooksRight
    LockOwned
    NoLeak
