\* MUTATION stale_read_version: a new attempt keeps the read version of the transaction's first
\* attempt instead of loading the clock again, so once a commit wrote a variable it reads, it
\* retries forever, alone too. Expected: SoloEnds broken. The safety properties hold beside it.
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgCross
    Mutation = "stale_read_version"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
PROPERTIES
    SoloEnds
