\* Two threads, two transactions each, on two variables: commits that follow commits, a read of
\* both against them.
\* What it catches: what ST_transfer3 catches, through two rounds of commits and the real-time
\* order between transactions of one thread.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgRounds
    Mutation = "none"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
