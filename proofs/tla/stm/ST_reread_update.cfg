\* An update transaction loads a variable twice while another commits it: it never sees two
\* values of it.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgRereadUpdate
    Mutation = "none"
    Witness = "none"
INVARIANTS
    Opacity
    NoUseAfterFree
    DropOnce
    Serializable
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
