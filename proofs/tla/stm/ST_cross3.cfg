\* Each of two threads reads the variable the other writes (the write skew's shape), and a third
\* reads both.
\* What it catches: a write skew committed (each commit must validate the variable the other
\* may hold locked), a reader seeing either commit torn.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Vars = {1, 2}
    Prog <- ProgCrossRead
    Mutation = "none"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
