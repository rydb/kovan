\* A variable read twice in one transaction that no other thread writes, while another
\* variable is written.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgRereadQuiet
    Mutation = "none"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
