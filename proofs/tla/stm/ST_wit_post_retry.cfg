\* WITNESS: a load retries on a variable changed or locked between its two reads of the lock
\* word. Expected: NoPostRetryW broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Vars = {1, 2}
    Prog <- ProgTransfer3
    Mutation = "none"
    Witness = "post_retry"
INVARIANTS
    NoPostRetryW
