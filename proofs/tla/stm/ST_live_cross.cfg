\* The write skew's shape, every thread and the reclamation scheduled fairly.
\* What it catches: a transaction that never ends once it runs alone. (Both can abort each other
\* forever while both run: ST_wit_livelock.)
SPECIFICATION FairSpec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgCross
    Mutation = "none"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
PROPERTIES
    SoloEnds
