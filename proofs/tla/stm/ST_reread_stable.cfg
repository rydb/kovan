\* A repeat read that finds its variable unlocked finds the version its first read recorded:
\* `load`'s check of `first.version` never fires, since a commit's write version is above the read
\* version of every transaction already running. Expected: NoRereadVersionW holds.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgRereadTorn
    Mutation = "none"
    Witness = "reread_version"
INVARIANTS
    NoRereadVersionW
