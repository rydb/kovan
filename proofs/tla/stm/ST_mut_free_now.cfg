\* MUTATION free_now: the commit frees the node it replaces at once instead of retiring it,
\* under a reader that loaded it. Expected: NoUseAfterFree broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgTransfer
    Mutation = "free_now"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
