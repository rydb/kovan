\* MUTATION reread_unvalidated, for an update transaction that sees both values before its
\* commit aborts. Expected: Opacity broken.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgRereadUpdate
    Mutation = "reread_unvalidated"
    Witness = "none"
INVARIANTS
    Opacity
    NoUseAfterFree
    DropOnce
    Serializable
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
