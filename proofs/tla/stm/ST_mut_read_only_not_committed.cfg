\* MUTATION read_only_not_committed: the read-only commit does not mark the transaction
\* committed, so its drop runs the rollback hooks. Expected: HooksRight broken.
\* The other safety properties are checked after it, so nothing else broke first.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgTransfer
    Mutation = "read_only_not_committed"
    Witness = "none"
INVARIANTS
    HooksRight
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    LockOwned
    NoLeak
