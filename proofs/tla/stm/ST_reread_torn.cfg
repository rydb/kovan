\* A transaction loads x, then y, then x again while another commits both: it never sees
\* x new with y old.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2}
    Vars = {1, 2}
    Prog <- ProgRereadTorn
    Mutation = "none"
    Witness = "none"
INVARIANTS
    AllOrNone
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    HooksRight
    LockOwned
    NoLeak
