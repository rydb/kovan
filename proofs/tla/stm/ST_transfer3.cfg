\* Three threads on two variables: a transfer between them; a read of both, then an increment
\* of the second; an increment of the first.
\* What it catches: a lost update, a reader seeing a commit torn or an inconsistent snapshot, a
\* node freed under a reader, a value dropped twice or never, a lock kept or shared.
SPECIFICATION Spec
CONSTANTS
    Threads = {1, 2, 3}
    Vars = {1, 2}
    Prog <- ProgTransfer3
    Mutation = "none"
    Witness = "none"
INVARIANTS
    NoUseAfterFree
    DropOnce
    Serializable
    Opacity
    AllOrNone
    HooksRight
    LockOwned
    NoLeak
